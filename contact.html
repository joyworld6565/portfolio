<main>
<section class="container narrow">
  <h1>Contact me</h1>
  <p class="lead">Have a question or a collaboration idea? Send a message and I will reply soon.</p>
  <form id="contact-form" novalidate>
    <div class="field"><label for="name">Name</label><input type="text" id="name" name="name" autocomplete="name"><small class="error" id="name-error"></small></div>
    <div class="field"><label for="email">Email address</label><input type="email" id="email" name="email" autocomplete="email"><small class="error" id="email-error"></small></div>
    <div class="field"><label for="phone">Phone number</label><input type="tel" id="phone" name="phone" autocomplete="tel" inputmode="numeric"><small class="error" id="phone-error"></small></div>
    <div class="field"><label for="message">Message</label><textarea id="message" name="message" rows="5"></textarea><small class="error" id="message-error"></small></div>
    <button class="btn" type="submit">Send message</button>
    <p id="form-success" class="success" role="status"></p>
  </form>
</section>
</main>
