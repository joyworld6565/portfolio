<main>
<section class="container narrow">
  <h1>Academic planner</h1>
  <p class="lead">Plan your coursework. Add a task, tick it off when done, delete it when you no longer need it.</p>
  <form id="task-form" class="inline-form">
    <label for="task-input" class="sr-only">New task</label>
    <input type="text" id="task-input" placeholder="e.g. Finish COS 106 term project" maxlength="100" autocomplete="off">
    <button class="btn" type="submit">Add task</button>
  </form>
  <p id="task-error" class="error" role="alert"></p>
  <p id="task-count" class="muted" aria-live="polite"></p>
  <ul id="task-list" class="tasks"></ul>
</section>
</main>
